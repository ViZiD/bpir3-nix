name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v15
        with:
          name: bpir3-nix
          authToken: ${{ github.event_name != 'pull_request' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ github.event_name == 'pull_request' }}
          pushFilter: "(-source$|nixpkgs\\.tar\\.gz$)"

      - name: Build kernel and bootloader
        run: |
          nix build -L '.#packages.aarch64-linux.kernel^out,dev,modules'
          nix build -L .#packages.aarch64-linux.uboot

      - name: Push to Cachix
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          {
            nix path-info '.#packages.aarch64-linux.kernel^out,dev,modules'
            nix path-info .#packages.aarch64-linux.uboot
          } | xargs cachix push bpir3-nix
