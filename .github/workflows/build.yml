name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - uses: cachix/cachix-action@v15
        with:
          name: bpir3-nix
          authToken: ${{ github.event_name != 'pull_request' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ github.event_name == 'pull_request' }}
          pushFilter: "(-dev$|-source$|nixpkgs\\.tar\\.gz$)"

      - name: Build kernel and bootloader
        run: |
          nix build -L --out-link result-kernel .#packages.aarch64-linux.kernel
          nix build -L --out-link result-modules .#packages.aarch64-linux.kernelModules
          nix build -L --out-link result-uboot .#packages.aarch64-linux.uboot

      - name: Push to Cachix
        if: github.event_name != 'pull_request'
        run: |
          cachix push bpir3-nix \
            "$(readlink -f result-kernel)" \
            "$(readlink -f result-modules)" \
            "$(readlink -f result-uboot)"
